<style>
html,body{margin:0}
/* Layout: uma coluna estreita de celular. Perguntas no escuro (a caverna), resultado se abre no claro (a luz do raio-x). */
:root{
  --noite:#0B0809; --noite-2:#161012; --linha-esc:#2B2225;
  --creme:#F2EADF; --suave:#A89A92;
  --destaque:#1E43B0; --destaque-vivo:#4A70DD;
  --ouro:#C9A24A; --ouro-escuro:#8A6A1E; --solto:#9A3B2E;
  --luz:#F2E9DE; --luz-2:#E9DDD0; --tinta:#1C1416; --tinta-suave:#6F605B; --linha-clara:#D8C9BB;
  --f-tit:"Archivo","Arial Narrow",Impact,sans-serif;
  --f-txt:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-voz:"Instrument Serif",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
/* tokens de superfície ficam no body, para acompanhar a troca preto/azul */
body{ --bg:var(--noite); --fg:var(--creme); --muted:var(--suave); --line:var(--linha-esc); --card:var(--noite-2) }
body.luz{ --bg:var(--luz); --fg:var(--tinta); --muted:var(--tinta-suave); --line:var(--linha-clara); --card:var(--luz-2); color-scheme:light }
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-txt);font-size:17px;line-height:1.5;transition:background .6s ease,color .6s ease;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:540px;margin:0 auto;padding-inline:20px;padding-block:0 48px}

/* faixa do público (só na abertura, igual à página do vídeo) */
.publico{color:var(--ouro);border-bottom:1px solid var(--line);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;text-align:center;padding:11px 16px}
/* rodapé: assinatura e, no rascunho, o atalho de revisão */
.rodape{margin-top:44px;text-align:center;display:grid;gap:6px}
.rodape .assin{margin:0}
.rascunho{font-size:11px;letter-spacing:.06em;color:var(--muted);margin:0}
.rascunho b{color:var(--ouro);font-weight:700;letter-spacing:.14em}
/* uma tela, um eixo: capas (abertura e "pronto") centralizadas; perguntas à esquerda */
.capa{text-align:center}
.capa .lead{margin-inline:auto;max-width:31ch;font-size:16px;line-height:1.55;text-wrap:balance}
.capa h1 em{display:block}
@media (max-width:420px){.publico{font-size:11px;letter-spacing:.1em;padding-inline:10px}}
.q .btn{margin-left:0}
.q .link{margin-left:0}
.q .premio-linha{justify-content:flex-start}
/* lembrete do prêmio, embaixo de cada pergunta */
.premio-linha{display:flex;align-items:center;justify-content:center;gap:8px;margin:26px 0 0;font-size:13px;color:var(--muted)}
.rascunho .link{display:inline;padding:0;margin:0;font-size:11px}

/* topo do quiz */
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px;min-height:56px}
.voltar{background:none;border:0;padding:6px 0;color:var(--muted);font-size:14px;cursor:pointer}
.voltar:focus-visible,.opc:focus-visible,.btn:focus-visible,.link:focus-visible{outline:2px solid var(--ouro);outline-offset:3px}
.contador{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.barra{height:2px;background:var(--line);position:relative}
.barra i{position:absolute;inset:0 auto 0 0;background:var(--ouro);transition:width .4s ease}

.tela{padding-block:28px 12px;animation:entra .35s ease both}
@keyframes entra{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ouro);font-weight:600}
body.luz .kicker{color:var(--ouro-escuro)}
h1,h2,h3{font-family:var(--f-tit);font-stretch:72%;font-weight:850;letter-spacing:-.01em;line-height:1.02;margin:0;text-wrap:balance}
h1{font-size:clamp(40px,11vw,56px)}
h2{font-size:clamp(28px,7.5vw,36px)}
.pergunta{font-size:clamp(28px,7.6vw,36px);margin-top:12px}
.ajuda{color:var(--muted);margin:14px 0 0;font-size:15px;max-width:60ch}
.lead{color:var(--muted);margin:18px 0 0;max-width:60ch}

.opcoes{display:grid;gap:10px;margin-top:28px}
.opc{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);padding:16px 18px;cursor:pointer;transition:border-color .15s,background .15s;font-size:17px}
.opc small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.opc:hover{border-color:var(--suave)}
.opc.sel{border-color:var(--ouro);background:color-mix(in srgb,var(--ouro) 10%,var(--noite-2))}

textarea{width:100%;margin-top:24px;min-height:130px;background:var(--card);border:1px solid var(--line);color:var(--fg);font-family:var(--f-voz);font-size:22px;line-height:1.3;padding:16px;resize:vertical}
textarea::placeholder{color:#6d625d;font-style:italic}
textarea:focus{outline:none;border-color:var(--ouro)}

.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px;width:fit-content;max-width:100%;min-height:58px;margin:28px auto 0;padding:18px 34px;border:0;border-radius:16px;color:#FBF4EC;
  background:linear-gradient(135deg,var(--destaque-vivo) 0%,var(--destaque) 48%,#132E86 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(5,15,50,.4),0 14px 30px -12px rgba(74,112,221,.6);
  font-family:var(--f-tit);font-stretch:85%;font-weight:800;font-size:18px;letter-spacing:.02em;text-transform:uppercase;text-align:center;cursor:pointer;
  transition:transform .18s cubic-bezier(.16,1,.3,1),box-shadow .18s cubic-bezier(.16,1,.3,1)}
/* o raio de luz que atravessa o botão a cada 4 s (igual à página do vídeo) */
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-70%;width:46%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.45) 50%,transparent);transform:skewX(-14deg);animation:raio-btn 4.2s cubic-bezier(.16,1,.3,1) infinite;pointer-events:none}
@keyframes raio-btn{0%{left:-70%}45%,100%{left:130%}}
.btn:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(5,15,50,.45),0 24px 48px -14px rgba(74,112,221,.7)}
.btn:active{transform:translateY(0)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px;padding:12px 0;display:block;margin:6px auto 0}

/* abertura */
.abre{padding-top:56px}
.abre h1 em{font-family:var(--f-voz);font-style:italic;font-weight:400;font-stretch:100%;color:var(--ouro)}
.selo{width:17px;height:17px;color:var(--ouro);flex:none}

/* escaneando */
.scan{position:fixed;inset:0;background:var(--noite);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50;overflow:hidden}
.scan p{font-family:var(--f-tit);font-stretch:75%;font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.02em;margin:0}
.scan small{color:var(--suave)}
.scan .raio{position:absolute;left:0;right:0;height:2px;background:var(--ouro);box-shadow:0 0 24px 6px rgba(201,162,74,.45);animation:raio 1.1s ease-in-out infinite alternate}
@keyframes raio{from{top:12%}to{top:88%}}

/* RESULTADO */
.salvo{font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding-block:12px;display:flex;gap:8px;align-items:center}
/* barra "quase lá": 80% completa, falta o plano */
.quase{padding-block:14px 4px}
.quase-txt{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.quase-txt b{color:var(--ouro-escuro);letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.quase-barra{height:6px;background:var(--linha-clara);border-radius:3px;margin-top:8px;overflow:hidden}
.quase-barra i{display:block;height:100%;width:80%;background:var(--cor-quase,#E8833A);border-radius:3px;transition:background .3s}
.salvo::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ouro);flex:none}
.res-hero{padding-block:40px 8px}
.res-hero h1{font-size:clamp(42px,12vw,60px);margin-top:12px}
.res-hero h1 em{font-family:var(--f-voz);font-style:italic;font-weight:400;font-stretch:100%;color:var(--ouro-escuro)}
.secao{padding-block:44px 0}
.secao>.kicker{display:block;margin-bottom:10px}
.sub{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:34px 0 14px}

/* pontas soltas */
.pontas{display:flex;flex-wrap:wrap;gap:14px 12px;padding:22px 16px;border:1px dashed var(--linha-clara);background:color-mix(in srgb,var(--luz-2) 60%,var(--luz))}
.ponta{display:inline-flex;align-items:center;padding:10px 12px 12px;font-size:15px;line-height:1.25;color:#1C1416;border-radius:2px;box-shadow:0 1px 1px rgba(0,0,0,.08),0 6px 12px -6px rgba(60,40,20,.35)}
.ponta.perfil{background:#FBF4E6;outline:1.5px solid var(--ouro-escuro);outline-offset:-1.5px}
.cores i.cor-perfil{background:#FBF4E6;outline:1.5px solid var(--ouro-escuro);outline-offset:-1.5px}
.ponta.verde{background:#CFE8A6}
.ponta.amarelo{background:#F7E27C}
.ponta.rosa{background:#F5B9C6}
.cores{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0 0;font-size:13px;color:var(--muted)}
.cores span{display:inline-flex;align-items:center;gap:6px}
.cores i{width:12px;height:12px;border-radius:2px;display:inline-block}
.ponta:nth-child(3n+1){transform:rotate(-1.4deg) translateY(2px)}
.ponta:nth-child(3n+2){transform:rotate(1.1deg) translateY(-3px)}
.ponta:nth-child(4n){transform:rotate(-.6deg) translateY(4px)}
.legenda{font-size:14px;color:var(--muted);margin:10px 0 0}

.soltos{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.soltos li{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;font-size:18px;line-height:1.4}
.soltos li>*{min-width:0}
.soltos .marca{width:14px;height:14px;border-radius:2px;margin-top:6px;box-shadow:0 2px 4px -2px rgba(60,40,20,.4)}
.marca.perfil{background:transparent;border:2px solid var(--ouro-escuro);transform:rotate(45deg);border-radius:1px}
.marca.verde{background:#CFE8A6}.marca.amarelo{background:#F7E27C}.marca.rosa{background:#F5B9C6}
.juntas{font-family:var(--f-voz);font-style:italic;font-size:24px;color:var(--muted);margin:10px 0 0}
.res-hero h1 em{display:inline}
/* alerta: um pulso suave, não pisca-pisca */
.alerta{display:flex;align-items:center;gap:12px}
.pulso{width:14px;height:14px;border-radius:50%;background:var(--solto);flex:none;animation:pulso 1.8s ease-out infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(154,59,46,.55)}80%,100%{box-shadow:0 0 0 12px rgba(154,59,46,0)}}
.soltos q{font-family:var(--f-voz);font-style:italic;font-size:1.12em}

.momento{border-top:2px solid var(--tinta);padding-top:16px}
.momento h3{font-size:28px}
.momento p{margin:10px 0 0;color:var(--muted);max-width:60ch}

/* plano: linha do tempo que conecta */
.plano-intro{color:var(--muted);margin:12px 0 0;max-width:60ch}
.trilha{list-style:none;margin:30px 0 0;padding:0;position:relative}
.trilha::before{content:"";position:absolute;left:11px;top:10px;bottom:10px;width:2px;background:var(--ouro-escuro)}
.etapa{position:relative;padding:0 0 34px 44px}
.etapa:last-child{padding-bottom:0}
.no{position:absolute;left:-2px;top:0;width:28px;height:28px;border-radius:50%;border:2px solid var(--ouro-escuro);background:conic-gradient(var(--ouro-escuro) 0 var(--f),var(--luz) var(--f) 360deg)}
.etapa .meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.etapa h3{font-size:26px;margin-top:6px}
.status{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;padding:4px 10px;color:#1C1416;border-radius:2px}
.status.verde{background:#CFE8A6}.status.amarelo{background:#F7E27C}.status.rosa{background:#F5B9C6}
.etapa p{margin:12px 0 0;max-width:60ch}
.tforca{background:none;border:1px solid var(--line);color:var(--muted);font-size:11px;padding:2px 8px;cursor:pointer;margin:4px 2px 0}
.tforca[aria-pressed="true"]{background:var(--ouro);color:#1C1416;border-color:var(--ouro)}
.caminhos{display:grid;gap:10px;margin-top:14px}
.caminhos p{margin:0;font-size:16px;line-height:1.45;padding:12px 14px;border:1px solid var(--linha-clara)}
.caminhos p b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
/* "sozinha": borda viva na cor do status, com brilho; "na Caverna": tudo dourado, sem fundo escuro */
.caminhos .so{background:var(--luz);border-width:2px}
.caminhos .so.verde{border-color:#7CC24A;box-shadow:0 0 0 4px rgba(124,194,74,.22)}
.caminhos .so.amarelo{border-color:#E8C21E;box-shadow:0 0 0 4px rgba(232,194,30,.25)}
.caminhos .so.rosa{border-color:#E57A93;box-shadow:0 0 0 4px rgba(229,122,147,.22)}
/* "na Caverna": aberto, sem quadro; a frase leva um marca-texto na cor do status */
.caminhos .cav{border:0;padding:4px 0 0;color:var(--tinta)}
.caminhos .cav b{color:var(--ouro-escuro)}
.mt{padding:1px 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone;background:linear-gradient(transparent 14%,var(--mtc) 14%,var(--mtc) 92%,transparent 92%)}
.mt.verde{--mtc:#CFE8A6}.mt.amarelo{--mtc:#F7E27C}.mt.rosa{--mtc:#F5B9C6}
.sai{margin-top:12px;font-size:15px;color:var(--muted)}
.sai b{color:var(--tinta);font-weight:600}
.provisorio{font-size:13px;color:var(--muted);margin-top:26px;border-left:2px solid var(--ouro);padding-left:10px}

/* fechamento volta ao escuro */
.fecho{background:var(--noite);color:var(--creme);margin-top:56px;padding:48px 20px 40px}
.fecho-in{max-width:540px;margin:0 auto}
.fecho .kicker{color:var(--ouro)}
.norte{font-family:var(--f-voz);font-style:italic;font-size:clamp(30px,8.4vw,40px);line-height:1.12;margin:14px 0 0;text-wrap:balance;color:var(--ouro)}
.norte b{font-family:var(--f-tit);font-style:normal;font-stretch:72%;font-weight:850;color:var(--creme)}
.video{margin-top:30px;aspect-ratio:16/9;max-width:100%;background:#000;border:1px solid var(--linha-esc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--suave);font-size:14px;text-align:center;padding:12px}
.play{width:64px;height:64px;border-radius:50%;border:2px solid var(--creme);display:flex;align-items:center;justify-content:center}
.play::after{content:"";border-left:18px solid var(--creme);border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.leva{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:10px}
.leva li{display:grid;grid-template-columns:18px 1fr;gap:10px;color:var(--creme)}
.leva li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ouro);margin-top:9px}
.preco{margin-top:26px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.preco strong{font-family:var(--f-tit);font-stretch:75%;font-weight:850;font-size:44px;line-height:1}
.preco span{color:var(--suave);font-size:14px}
.campos{margin-top:18px;color:var(--suave);font-size:15px;border-top:1px solid var(--linha-esc);padding-top:14px}
.fecho .btn{margin-top:22px}
.assin{margin-top:36px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--suave);text-align:center}
.fecho .link{color:var(--suave)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* capa do vídeo 2, no mesmo estilo da capa do vídeo 1 */
.video.v2{position:relative;padding:0;overflow:hidden;display:block}
.capa2{position:absolute;inset:0;background-color:var(--noite);
  background-image:linear-gradient(rgba(201,162,74,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(201,162,74,.06) 1px,transparent 1px),radial-gradient(120% 90% at 50% 40%,#1a1316 0%,var(--noite) 70%);background-size:22px 22px,22px 22px,100% 100%}
.capa2-kicker{position:absolute;left:0;right:0;top:8%;text-align:center;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--creme);font-weight:600}
.capa2-txt{position:absolute;left:0;right:0;top:19%;text-align:center;font-family:var(--f-voz);font-style:italic;font-size:clamp(18px,5.4vw,26px);color:var(--ouro)}
.capa2-pe{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--creme)}
.pi2{position:absolute;padding:4px 8px 6px;font-size:clamp(10px,2.7vw,13px);font-weight:600;color:#1C1416;border-radius:2px;transform:rotate(var(--r));box-shadow:0 6px 12px -6px rgba(0,0,0,.7)}
.pi2.verde{background:#CFE8A6}.pi2.amarelo{background:#F7E27C}.pi2.rosa{background:#F5B9C6}
.scan2{position:absolute;left:0;right:0;height:2px;background:var(--ouro);box-shadow:0 0 18px 4px rgba(201,162,74,.45);animation:scan2 2.4s ease-in-out infinite alternate}
@keyframes scan2{from{top:30%}to{top:88%}}
.play2{position:absolute;left:50%;top:56%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;
  background:linear-gradient(135deg,#4A70DD 0%,var(--destaque) 48%,#132E86 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 30px rgba(0,0,0,.5),0 0 0 8px rgba(74,112,221,.25)}
.play2::after{content:"";position:absolute;left:28px;top:21px;border-left:22px solid #FBF4EC;border-top:14px solid transparent;border-bottom:14px solid transparent}

/* nome no fim do quiz: o mesmo campo com o raio dourado da página de captação */
.campo-nome{display:grid;gap:8px;justify-items:center;margin-top:24px}
.campo-nome label{font-family:var(--f-voz);font-style:italic;font-size:22px;color:var(--ouro)}
@property --giro{syntax:"<angle>";inherits:false;initial-value:0deg}
.anel{width:100%;max-width:340px;padding:1.5px;border-radius:13px;background:conic-gradient(from var(--giro),var(--line) 0 62%,var(--ouro) 80%,#F3DC9A 86%,var(--line) 94%);animation:gira 2.6s linear infinite}
.anel.parado{animation:none;background:var(--ouro)}
@keyframes gira{to{--giro:360deg}}
.anel input{display:block;width:100%;background:var(--card);border:0;color:var(--fg);font:inherit;font-size:18px;text-align:center;padding:14px 16px;border-radius:12px}
.anel input:focus{outline:none}
.anel.erro{background:#E0675A;animation:treme .35s ease}
@keyframes treme{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.falta{color:#E0675A;font-size:15px;font-weight:600;margin:0}

/* vídeo 2 tocando mudo: só a frase, o scanner e o "toque para ouvir" por cima */

const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function abertura(){
  passo=-1; document.body.classList.remove("luz");
  app.innerHTML = `<div class="publico">Exclusivo para especialistas e mentoras</div><div class="wrap"><section class="tela abre capa">

}

function pergunta(){
  salva("quiz");
  const q=Q[passo]; const total=Q.length;
  let corpo;
  if(q.aberta){
    corpo=`<textarea id="txt" placeholder="${esc(q.ph)}" maxlength="160">${esc(R[q.id]||"")}</textarea>
      <button class="btn" id="seguir">Continuar</button>
      <button class="link" id="pular">Não sei dizer agora</button>`;
  } else {
    const temImg = IMAGENS && q.o.some(o=>o.img);
    corpo=`<div class="opcoes">${q.o.map((o,i)=>`<button class="opc${R[q.id]===i?" sel":""}${temImg?" com-img":""}" data-i="${i}">${temImg?`<span class="opc-img">${o.img}</span>`:""}<span class="opc-txt">${esc(o.t)}${o.d?`<small>${esc(o.d)}</small>`:""}</span></button>`).join("")}</div>`;
  }
  app.innerHTML=`<div class="wrap">
    <div class="topo"><button class="voltar" id="voltar">← Voltar</button><span class="contador">${passo+1} / ${total}</span></div>
    <div class="barra"><i style="width:${(passo/total)*100}%"></i></div>
    <section class="tela q"><span class="kicker">${esc(q.bloco)}</span>
      <h2 class="pergunta">${esc(q.t)}</h2>${q.ajuda?`<p class="ajuda">${esc(q.ajuda)}</p>`:""}${corpo}${PREMIO}</section>${RODAPE(false)}</div>`;
  document.getElementById("voltar").onclick=()=>{ if(passo===0) abertura(); else {passo--;pergunta();} };
  if(q.aberta){
    const t=document.getElementById("txt");
    document.getElementById("seguir").onclick=()=>{R[q.id]=t.value.trim();avanca();};
    document.getElementById("pular").onclick=()=>{R[q.id]="";avanca();};
  } else {
    app.querySelectorAll(".opc").forEach(b=>b.onclick=()=>{
      app.querySelectorAll(".opc").forEach(x=>x.classList.remove("sel")); b.classList.add("sel");
      R[q.id]=+b.dataset.i; setTimeout(avanca,260);
    });
  }
  window.scrollTo(0,0);
}
function avanca(){ passo++; if(passo<Q.length) pergunta(); else pronto(); }

function pronto(){
  salva("pronto");
  const pedeNome = !nomeLink; /* com o agente, o nome vem no link e este campo some */
  app.innerHTML=`<div class="wrap">
    <div class="topo"><button class="voltar" id="voltar">← Voltar</button><span class="contador">${Q.length} / ${Q.length}</span></div>
    <div class="barra"><i style="width:100%"></i></div>

      <h1 style="margin-top:14px">${pedeNome ? "O seu <em style=\"display:inline\">Raio-X</em> está pronto." : comNome("o seu <em style=\"display:inline\">Raio-X</em> está pronto.")}</h1>
      ${pedeNome ? `<div class="campo-nome">
        <label for="nome-rx">Seu nome para personalizar</label>
        <div class="anel" id="anel-rx"><input id="nome-rx" type="text" placeholder="Seu nome" autocomplete="given-name" maxlength="40"></div>
        <p class="falta" id="falta-rx" role="alert" hidden>Falta o seu nome.</p>
      </div>` : `<p class="lead">Ele mostra onde você está e o que você precisa construir, na ordem.</p>`}
      <button class="btn" id="ver">Ver meu Raio-X e plano de ação</button></section></div>`;
  document.getElementById("voltar").onclick=()=>{passo=Q.length-1;pergunta();};
  const ver=()=>{
    if(pedeNome){
      const c=document.getElementById("nome-rx"), nome=c.value.trim().replace(/\s+/g," ").split(" ")[0];
      if(!nome){ const a=document.getElementById("anel-rx"); document.getElementById("falta-rx").hidden=false; a.classList.remove("erro"); void a.offsetWidth; a.classList.add("erro"); c.focus(); setTimeout(()=>a.classList.remove("erro"),900); return; }
      defineNome(nome);
    }
    escanear();
  };
  document.getElementById("ver").onclick=ver;
  if(pedeNome){
    const c=document.getElementById("nome-rx"), a=document.getElementById("anel-rx");
    c.addEventListener("keydown",e=>{ if(e.key==="Enter") ver(); });
    c.addEventListener("input",()=>{ const tem=!!c.value.trim(); a.classList.toggle("parado",tem); if(tem) document.getElementById("falta-rx").hidden=true; });
  }
}

function escanear(){
  px("RaioXConcluido",true);
  const s=document.createElement("div"); s.className="scan";
  s.innerHTML=`<div class="raio"></div><p>Montando o seu Raio-X</p><small>Ligando as suas respostas às etapas</small>`;
  document.body.appendChild(s);
  const rm=matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(()=>{s.remove();resultado();},rm?300:2200);
}

/* o botão de cima desce a página devagar até o botão do plano, passando por tudo o que ela precisa ler */
function desceDevagar(alvo){
  const ini=window.scrollY, fim=alvo.getBoundingClientRect().top+window.scrollY-window.innerHeight/2;
  const dur=matchMedia("(prefers-reduced-motion: reduce)").matches?0:8000, t0=performance.now();
  let parou=false; const para=()=>{parou=true;};
  ["wheel","touchstart","keydown"].forEach(ev=>window.addEventListener(ev,para,{once:true,passive:true}));
  function passo(t){
    if(parou) return;
    const k=Math.min(1,dur?(t-t0)/dur:1), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    window.scrollTo(0,ini+(fim-ini)*e);
    if(k<1) requestAnimationFrame(passo);
  }
  requestAnimationFrame(passo);
}

/* Progresso guardado no celular dela: abrir o mesmo link volta onde parou.
   Terminou o quiz e não viu o plano → volta no Raio-X; já viu o plano → volta no plano. */
function guarda(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function le(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function salva(tela){ guarda("raiox-estado", JSON.stringify({tela, passo, R, nome:NOME})); }
(function inicia(){

  R=e.R||{}; passo=e.passo; if(e.nome) defineNome(e.nome);
  if(e.tela==="plano") plano();
  else if(e.tela==="raiox") diagnostico();
  else if(e.tela==="pronto") pronto();
  else if(e.tela==="quiz" && passo>=0 && passo<Q.length) pergunta();
  else abertura();
})();
